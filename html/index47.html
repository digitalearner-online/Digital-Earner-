<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login-Signup Form</title>
  <link rel="stylesheet" href="../css/style47.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
  <div class="container">
    <div class="form-box login">
      <form action="#">
        <h1>Login</h1>
        <div class="input-box">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <i class="bx bxs-user"></i>
        </div>
        <div id="loginEmailError" class="error-text"></div>
        <div class="email-suggestions" id="loginSuggestions"></div>
        <div class="input-box">
          <input type="password" id="loginPass" placeholder="Password" required />
          <i class="bx bxs-lock-alt" id="loginPassToggle"></i>
        </div>
        <div id="loginPassError" class="error-text"></div>
        <div class="forgot-link">
          <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>
        <button type="submit" id="loginBtn" class="btn">Login</button>
      </form>
    </div>
    
    <div class="form-box register">
      <form action="#">
        <h1>Registration</h1>
        <div class="input-box">
          <input type="text" id="regUser" placeholder="Username" required />
          <i class="bx bxs-user"></i>
        </div>
        <div id="regUserError" class="error-text"></div>
        <div class="input-box">
          <input type="email" id="regEmail" placeholder="Email" required />
          <i class="bx bxs-envelope"></i>
        </div>
        <div id="regEmailError" class="error-text"></div>
        <div class="email-suggestions" id="registerSuggestions"></div>
        <div class="input-box">
          <input type="password" id="regPass" placeholder="Password" required />
          <i class="bx bxs-lock-alt" id="regPassToggle"></i>
        </div>
        <div id="regPassError" class="error-text"></div>
        <div class="input-box">
          <input type="password" id="regConfirmPass" placeholder="Confirm Password" required />
          <i class="bx bxs-lock-open-alt" id="regConfirmPassToggle"></i>
        </div>
        <div id="regConfirmPassError" class="error-text"></div>
        <div class="input-box">
          <input type="text" id="regSponsor" placeholder="Sponsor ID" required />
          <i class="bx bxs-id-card"></i>
        </div>
        <div id="regSponsorError" class="error-text"></div>
        <button type="submit" id="regBtn" class="btn">Register</button>
      </form>
    </div>
    
    <div class="toggle-box">
      <div class="toggle-panel toggle-left">
        <h1>Hello, Welcome!</h1>
        <p>Don't have an account?</p>
        <button class="btn register-btn">Register</button>
      </div>
      
      <div class="toggle-panel toggle-right">
        <h1>Welcome Back!</h1>
        <p>Already have an account?</p>
        <button class="btn login-btn">Login</button>
      </div>
    </div>
  </div>
  
  <div id="loading">
    <div class="loader">
      <div></div>
    </div>
  </div>
  
  <script type="module" src="../js/script47.js"></script>
</body>

</html>
