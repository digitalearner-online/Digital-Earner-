<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Withdrawals - Digital Earner</title>
    <link rel="stylesheet" href="../css/admin-withdraw.css">
</head>
<body>

<div id="adminPanel">
    <div class="admin-container">
        <div class="clearfix">
            <button class="logout-btn" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
        <div class="admin-title">💰 Withdrawal Requests</div>
        
        <div class="summary-card">
            <div class="summary-grid">
                <div class="summary-item"><div class="summary-label">Pending</div><div class="summary-value pending" id="pendingAmount">₹0</div></div>
                <div class="summary-item"><div class="summary-label">Approved</div><div class="summary-value approved" id="approvedAmount">₹0</div></div>
                <div class="summary-item"><div class="summary-label">Rejected</div><div class="summary-value rejected" id="rejectedAmount">₹0</div></div>
            </div>
        </div>
        
        <div id="requestsList" class="requests-list"><div style="text-align:center; padding:40px;">Loading...</div></div>
    </div>
</div>

<div id="toastMessage" class="toast-message"></div>
<script type="module" src="../js/admin-withdraw.js"></script>
</body>
</html>
