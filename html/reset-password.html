<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>

  <link rel="stylesheet" href="../css/style47.css" />

  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>

<div class="container">

    <div class="form-box login">

        <form action="#">

            <h1>Reset Password</h1>

            <div class="input-box">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                    required
                />
                <i class="bx bxs-lock-alt" id="newPasswordToggle"></i>
            </div>

            <div id="newPasswordError" class="error-text"></div>

            <div class="input-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                />
                <i class="bx bxs-lock-open-alt" id="confirmPasswordToggle"></i>
            </div>

            <div id="confirmPasswordError" class="error-text"></div>

            <button
                type="submit"
                id="resetBtn"
                class="btn">
                Update Password
            </button>

        </form>

    </div>

</div>

<div id="loading">
    <div class="loader">
        <div></div>
    </div>
</div>

<script type="module" src="../js/reset-password.js"></script>

</body>

</html>
