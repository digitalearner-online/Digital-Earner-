<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Claims - Digital Earner</title>
<link rel="stylesheet" href="../css/admin-claims.css">
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2>🔐 Admin Access</h2>
        <p>Enter your credentials to continue</p>
        <div class="input-group">
            <input type="email" id="adminEmail" placeholder="Admin Email" autocomplete="off">
            <div class="email-suggestions" id="emailSuggestions"></div>
        </div>
        <div class="input-group">
            <input type="password" id="adminPassword" placeholder="Password">
        </div>
        <div class="remember-group">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me for 30 days</label>
        </div>
        <button class="login-btn" id="loginBtn">Login →</button>
        <div id="loginError" class="error"></div>
    </div>
</div>

<div id="adminPanel" style="display: none;">
    <div class="admin-container">
        <div class="clearfix">
            <button class="logout-btn" onclick="logoutAdmin()">🚪 Logout</button>
        </div>
        <div class="admin-title">📋 Claims Management</div>
        
        <div class="summary-card">
            <div class="summary-grid">
                <div class="summary-item"><div class="summary-label">Pending</div><div class="summary-value pending" id="pendingCount">0</div></div>
                <div class="summary-item"><div class="summary-label">Approved</div><div class="summary-value approved" id="approvedCount">0</div></div>
                <div class="summary-item"><div class="summary-label">Rejected</div><div class="summary-value rejected" id="rejectedCount">0</div></div>
            </div>
        </div>
        
        <div id="claimsList" class="claims-list">Loading claims...</div>
    </div>
</div>

<div id="toastMessage" class="toast-message"></div>

<script type="module" src="../js/admin-claims.js"></script>
</body>
</html>
